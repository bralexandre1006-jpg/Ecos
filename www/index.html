<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Écos</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-500.woff2) format("woff2");font-weight:500;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-600.woff2) format("woff2");font-weight:600;font-display:block}
@font-face{font-family:Inter;src:url(fonts/inter-700.woff2) format("woff2");font-weight:700;font-display:block}
:root{
  --bg:#000;
  --s1:#0f0f11;
  --s2:#19191c;
  --s3:#26262a;
  --line:rgba(255,255,255,.06);
  --text:#f2f2f4;
  --muted:#8a8a93;
  --faint:#5a5a62;
  --green:#34d399;
  --red:#ff6b6b;
  --acc:#8b7cf6;
  --acc2:#a99cff;
  --accInk:#fff;
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.2,.9,.25,1.12);
  --ease2:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:Inter,Roboto,system-ui,sans-serif;font-weight:500;font-size:15px;line-height:1.3;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;letter-spacing:inherit}
input{font:inherit;color:inherit;letter-spacing:inherit}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.inc{color:var(--green)}
.exp{color:var(--red)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- lancement ---------- */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .3s ease,transform .3s ease}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
#splashLogo{width:112px;height:112px;position:relative}
#splashLogo svg{width:100%;height:100%;overflow:visible}
#eShape{transform-origin:50% 100%;transform-box:fill-box}
.sbar{transform-origin:50% 100%;transform-box:fill-box;transform:scaleY(0)}

/* ---------- en-tête ---------- */
#hdr{position:fixed;left:0;right:0;top:0;z-index:15;background:var(--bg);padding:calc(var(--sat) + 10px) 20px 10px;display:flex;align-items:center;gap:12px;min-height:calc(var(--sat) + 60px);border-bottom:1px solid transparent;transition:border-color .2s}
#hdr.line{border-color:var(--line)}
#htitle{flex:1;min-width:0;font-size:24px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center;flex-shrink:0;color:var(--muted);transition:transform .14s ease,background .15s}
.ib:active{transform:scale(.92);background:var(--s2)}
.ib.danger{color:var(--red)}

/* ---------- écrans ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 64px) 16px calc(var(--sab) + 104px);opacity:0;visibility:hidden;transform:translate3d(18px,0,0);transition:opacity .2s ease,transform .28s var(--ease2),visibility 0s .28s}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .2s ease,transform .28s var(--ease2),visibility 0s}
.screen.left{transform:translate3d(-18px,0,0)}
.screen::-webkit-scrollbar{display:none}

.card{background:var(--s1);border-radius:18px;padding:2px 14px}
.card.box{padding:14px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 4px 10px;min-height:28px}
.sec h2{font-size:15px;font-weight:600}
.link{color:var(--acc2);font-size:14px;padding:6px 0 6px 12px}
.link:active{opacity:.6}

/* solde */
.hero{padding:8px 4px 0}
.hero .lbl{color:var(--muted);font-size:14px}
.money{display:flex;align-items:flex-end;font-weight:700;letter-spacing:-.04em;line-height:1;--mi:min(46px,12.4vw)}
.money .d{color:var(--muted);letter-spacing:-.02em;margin-bottom:.12em}
.money .i,.money .d{display:inline-flex;align-items:flex-end}
.hero .money{margin:8px 0 18px}
.dg{display:inline-block;height:1em;overflow:hidden;line-height:1}
.st{display:flex;flex-direction:column;transition:transform .9s cubic-bezier(.2,.9,.22,1)}
.st b{display:block;height:1em;line-height:1;font-weight:inherit}
.io{display:flex;gap:32px}
.io .k{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}
.io .k i{width:7px;height:7px;border-radius:50%}
.io .v{font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.bud{margin-top:20px}
.budBar{height:4px;border-radius:2px;background:var(--s2);overflow:hidden}
.budBar i{display:block;height:100%;width:var(--w);border-radius:2px;transform-origin:left;animation:growX .9s var(--ease2) .15s both}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.budTop{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:8px}
.budTop b{color:var(--text);font-weight:600}

/* sélecteur */
.seg{display:flex;background:var(--s1);border-radius:12px;padding:3px;position:relative}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .2s;white-space:nowrap}
.seg button.on{color:var(--text)}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--s3);transition:transform .32s var(--ease)}
.seg.sm{flex-shrink:0}
.seg.sm button{flex:none;height:32px;padding:0 12px;font-size:13px}
.seg.acc button.on{color:var(--accInk)}
.seg.acc .knob{background:var(--acc)}
.sheet .seg,.card .seg{background:var(--s2)}

/* lignes */
.stack{display:flex;gap:3px;height:6px;margin:14px 0 6px}
.stack i{display:block;height:100%;border-radius:3px;min-width:5px;transform-origin:left;animation:growX .7s var(--ease2) both}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;font-weight:700;flex-shrink:0}
.row .mid{flex:1;min-width:0}
.row .t1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t1 small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.row .t2{font-size:13px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:15px;font-weight:600;white-space:nowrap;text-align:right;letter-spacing:-.015em}
.row .r small{display:block;font-size:12px;font-weight:600;margin-top:1px}
.row .chev{color:var(--faint);width:18px;height:18px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;line-height:1.5}
.pill{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600;background:var(--s2);color:var(--muted);white-space:nowrap}
.pill.good{background:rgba(52,211,153,.13);color:var(--green)}
.pill.bad{background:rgba(255,107,107,.13);color:var(--red)}

/* lignes glissables */
.swipe{position:relative;border-bottom:1px solid var(--line);touch-action:pan-y;overflow:hidden}
.swipe:last-child{border-bottom:none}
.swipe .row{border-bottom:none;background:var(--s1);position:relative;z-index:1;transition:opacity .15s}
.swipe .row:active{opacity:.6}
.swBg{position:absolute;inset:1px 0;border-radius:10px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:14px;background:rgba(255,107,107,.14);color:var(--red);font-size:13px;font-weight:600;opacity:0;transition:background .2s,color .2s}
.swipe.swiping .swBg{opacity:1}
.swipe.arm .swBg{background:var(--red);color:#fff}
.recIc{color:var(--acc2);margin-right:4px}

/* barre période */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.period{display:flex;align-items:center;flex:1;min-width:0}
.period button{width:38px;height:38px;border-radius:12px;background:var(--s1);display:grid;place-items:center;color:var(--muted);flex-shrink:0;transition:transform .14s ease}
.period button:active{transform:scale(.9);background:var(--s2)}
.period .lab{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:none;align-items:center;gap:10px;background:var(--s1);border-radius:12px;padding:0 4px 0 14px;height:40px;margin-bottom:10px}
.search .ic{width:18px;height:18px;color:var(--faint)}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15px}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search button{width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.histSum{font-size:14px;font-weight:600;white-space:nowrap}
.dayHead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:20px 4px 8px}
.dayHead span:first-child::first-letter{text-transform:uppercase}

/* stats */
.kv{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{flex:1;color:var(--muted);font-size:14px}
.kv .v{font-size:16px;font-weight:600;letter-spacing:-.02em}
.note{font-size:12px;color:var(--faint);margin:8px 4px 0}
.chart{width:100%;height:150px;display:block}
.chart .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.donut{display:block;width:136px;height:136px;margin:14px auto 6px}
.donut circle.s{transition:stroke-dasharray .8s var(--ease2)}

/* réglages */
.glabel{font-size:13px;color:var(--muted);margin:24px 6px 8px}
.glabel:first-child{margin-top:4px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.setRow:last-child{border-bottom:none}
.setRow .l{font-size:15px}
.setRow .sub{font-size:12px;color:var(--muted);margin-top:1px}
.setRow .val{margin-left:auto;color:var(--muted);font-size:14px}
.setRow .chev{color:var(--faint);width:18px;height:18px}
.setRow.red .l{color:var(--red)}
button.setRow:active{opacity:.55}
.inl{flex:1;min-width:0;max-width:170px;height:40px;background:none;border:none;outline:none;text-align:right;font-size:15px;font-weight:600;caret-color:var(--acc)}
.inl::placeholder{color:var(--faint);font-weight:500}
.switch{width:46px;height:28px;border-radius:14px;background:var(--s3);position:relative;transition:background .25s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.switch.on{background:var(--acc)}
.switch.on::after{transform:translateX(18px)}
.timeIn{height:36px;border-radius:10px;background:var(--s2);border:none;font-size:14px;font-weight:600;padding:0 10px;color-scheme:dark;outline:none}
.accents{display:flex;gap:10px}
.accents button{width:24px;height:24px;border-radius:50%;transition:transform .25s var(--ease),box-shadow .2s}
.accents button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff;transform:scale(.92)}
.ver{text-align:center;color:var(--faint);font-size:12px;margin:22px 0 4px}
.btn{height:50px;border-radius:15px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .14s ease,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--accInk)}
.btn.ghost{background:var(--s2)}
.btn.danger{background:rgba(255,107,107,.13);color:var(--red)}

/* ---------- navigation ---------- */
#navWrap{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 12px);z-index:20;display:flex;gap:10px;align-items:center;transform:translate3d(0,170%,0);transition:transform .55s var(--ease)}
#navWrap.show{transform:none}
#navWrap::before{content:"";position:absolute;left:-16px;right:-16px;top:-22px;bottom:calc(-12px - var(--sab));background:linear-gradient(to top,#000 55%,transparent);z-index:-1;pointer-events:none}
#nav{flex:1;height:58px;background:var(--s1);border-radius:20px;display:flex;align-items:center;padding:5px;position:relative}
#navKnob{position:absolute;top:5px;bottom:5px;left:5px;border-radius:15px;background:var(--s3);transition:transform .36s var(--ease)}
.nb{flex:1;height:48px;border-radius:15px;display:grid;place-items:center;color:var(--faint);position:relative;z-index:1;transition:color .2s}
.nb .ic{width:23px;height:23px;transition:transform .3s var(--ease)}
.nb.on{color:var(--text)}
.nb:active .ic{transform:scale(.85)}
#fab{width:58px;height:58px;border-radius:20px;background:var(--acc);color:var(--accInk);display:grid;place-items:center;flex-shrink:0;transition:transform .2s var(--ease)}
#fab .ic{width:24px;height:24px;stroke-width:2.4}
#fab:active{transform:scale(.9)}

/* ---------- feuilles ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .26s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--s1);border-radius:24px 24px 0 0;padding:8px 16px calc(var(--sab) + 14px);transform:translate3d(0,105%,0);transition:transform .4s var(--ease2);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.sheet::-webkit-scrollbar{display:none}
.sheet .card{background:var(--s2)}
.sheet .swipe .row,.sheet .row{background:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 14px}
.sheetHead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 14px;min-height:28px}
.sheetHead h3{font-size:18px;font-weight:700;letter-spacing:-.02em}
.sheetHead h3::first-letter{text-transform:uppercase}
.txTop{display:flex;gap:8px;align-items:center}
.txTop .seg{flex:1}
.txTop .ib{background:var(--s2)}
.amountBox{text-align:center;padding:20px 0 18px}
#amtView{display:inline-flex;align-items:baseline;justify-content:center;font-weight:700;letter-spacing:-.04em;line-height:1;transition:transform .12s}
#amtView .i{font-size:44px}
#amtView .d{font-size:22px;color:var(--muted);letter-spacing:-.02em}
#amtView.inc .i{color:var(--green)}
#amtView.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.chips{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,40px);grid-auto-columns:max-content;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chips.one{grid-template-rows:40px}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 13px 0 6px;border-radius:12px;background:var(--s2);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background .2s,transform .12s}
.chip:active{transform:scale(.95)}
.chip .av{width:28px;height:28px;border-radius:9px;font-size:13px}
.chip.on{box-shadow:inset 0 0 0 1.5px var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--s2))}
.chip.add{color:var(--muted);padding:0 13px}
.field{display:flex;gap:8px;margin:12px 0}
.field input[type=text]{flex:1;height:44px;border-radius:12px;background:var(--s2);border:none;font-size:15px;padding:0 14px;outline:none;min-width:0;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.field input[type=text]:focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
.field input::placeholder{color:var(--faint)}
.dateBtn{position:relative;height:44px;padding:0 13px;border-radius:12px;background:var(--s2);display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;overflow:hidden}
.dateBtn .ic{width:17px;height:17px;color:var(--muted)}
.dateBtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;color-scheme:dark}
.repBtn{height:44px;min-width:44px;padding:0 13px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:14px;font-weight:600;flex-shrink:0;box-shadow:inset 0 0 0 1.5px transparent;transition:background .2s,color .2s,box-shadow .2s}
.repBtn .ic{width:18px;height:18px;transition:transform .5s var(--ease)}
.repBtn span{display:none}
.repBtn.on{color:var(--acc2);box-shadow:inset 0 0 0 1.5px var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--s2))}
.repBtn.on .ic{transform:rotate(180deg)}
.repBtn.on span{display:inline}
@media (max-width:380px){.repBtn.on span{display:none}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 12px}
.key{height:50px;border-radius:14px;font-size:22px;font-weight:500;display:grid;place-items:center;transition:transform .1s,background .12s}
.key:active{transform:scale(.92);background:var(--s2)}
.key .ic{width:24px;height:24px;stroke-width:1.8}
.emojiGrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:14px 0}
.emojiGrid button{height:36px;border-radius:10px;font-size:19px;box-shadow:inset 0 0 0 1.5px transparent;transition:transform .2s var(--ease),box-shadow .2s}
.emojiGrid button.on{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--s2)}
.emojiGrid .letter{font-size:13px;font-weight:700;color:var(--muted)}
.colorGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px 0;margin:0 0 16px;justify-items:center}
.colorGrid button{width:26px;height:26px;border-radius:50%;transition:transform .2s var(--ease),box-shadow .2s}
.colorGrid button.on{box-shadow:0 0 0 2px var(--s1),0 0 0 4px #fff;transform:scale(.9)}
.catList{max-height:52vh;overflow-y:auto;margin:10px 0 12px}
.catList::-webkit-scrollbar{display:none}

/* bilan */
.recapHero{text-align:center;padding:4px 0 18px}
.recapHero .money{justify-content:center;--mi:min(40px,11vw)}
.recapHero .msg{color:var(--muted);font-size:14px;margin-top:10px;line-height:1.45}

/* verrou */
#lock{position:fixed;inset:0;z-index:98;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;transition:opacity .35s ease,transform .35s ease}
#lock.on{display:flex}
#lock.out{opacity:0;transform:scale(1.06);pointer-events:none}
#lock p{color:var(--muted);font-size:14px;text-align:center}
#fpBtn{width:88px;height:88px;border-radius:50%;background:var(--s1);display:grid;place-items:center;color:var(--acc2);position:relative}
#fpBtn .ic{width:42px;height:42px;stroke-width:1.5}
#fpBtn::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--acc);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.55}100%{transform:scale(1.3);opacity:0}}
#fpBtn.err{animation:shake .4s;color:var(--red)}

/* annuler */
#snack{position:fixed;left:16px;right:16px;bottom:calc(var(--sab) + 82px);z-index:60;display:flex;align-items:center;gap:10px;background:var(--s3);border-radius:14px;padding:0 6px 0 16px;height:48px;font-size:14px;opacity:0;transform:translate3d(0,12px,0) scale(.98);pointer-events:none;transition:opacity .2s ease,transform .28s var(--ease)}
#snack.on{opacity:1;transform:none;pointer-events:auto}
#snack span{flex:1}
#snackU{height:36px;padding:0 12px;border-radius:10px;color:var(--acc2);font-size:14px;font-weight:600}

/* dialogue */
#dlg{position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:28px;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s}
#dlg.on{opacity:1;pointer-events:auto}
#dlg .box{background:var(--s1);border-radius:22px;padding:22px 18px 18px;width:100%;max-width:340px;transform:scale(.94);transition:transform .28s var(--ease)}
#dlg.on .box{transform:none}
#dlg h4{font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
#dlg p{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.45}
#dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fadeUp{animation:fadeUp .36s var(--ease2) both}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
</style>

<script>
(()=>{
/* ================= DONNÉES ================= */
const KEY='ecos_v1';
const COLORS=['#7c8cff','#ff6b6b','#2dd4bf','#38bdf8','#a78bfa','#f472b6','#fbbf24','#34d399','#fb923c','#60a5fa','#e879f9','#a3e635','#f87171','#94a3b8','#c084fc','#facc15'];
const EMOJIS=['','🛒','🍔','☕','🍕','🚗','⛽','🚌','🏠','💡','📱','🎮','🎬','👕','💊','🏋️','✈️','🎁','🐶','📚','💇','🍺','🧾','🔧','💰','💼','🏦','📈','🪙','🎓','❤️','⭐','🛠️','🍼','🧴','📦'];
const ACCENTS=[{c:'#8b7cf6',c2:'#a99cff',ink:'#fff'},{c:'#e8b44c',c2:'#f5d37f',ink:'#1a1305'},{c:'#4f8cff',c2:'#8db4ff',ink:'#fff'},{c:'#34d399',c2:'#7ee8bf',ink:'#062a1d'},{c:'#f472b6',c2:'#f9a8d4',ink:'#fff'},{c:'#f5f5f7',c2:'#ffffff',ink:'#000'}];
const DEFAULT_CATS=[
  {id:'c1',name:'Courses',emoji:'',color:'#2dd4bf',type:'expense'},
  {id:'c2',name:'Resto',emoji:'',color:'#fb923c',type:'expense'},
  {id:'c3',name:'Transport',emoji:'',color:'#38bdf8',type:'expense'},
  {id:'c4',name:'Logement',emoji:'',color:'#a78bfa',type:'expense'},
  {id:'c5',name:'Loisirs',emoji:'',color:'#f472b6',type:'expense'},
  {id:'c6',name:'Abonnements',emoji:'',color:'#7c8cff',type:'expense'},
  {id:'c7',name:'Autre',emoji:'',color:'#94a3b8',type:'expense'},
  {id:'c8',name:'Salaire',emoji:'',color:'#34d399',type:'income'},
  {id:'c9',name:'Ventes',emoji:'',color:'#fbbf24',type:'income'},
  {id:'c10',name:'Autre entrée',emoji:'',color:'#a3e635',type:'income'}
];
let db;
function load(){
  try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
  if(!db||!Array.isArray(db.tx))db={tx:[],cats:DEFAULT_CATS.map(c=>({...c}))};
  if(!Array.isArray(db.cats)||!db.cats.length)db.cats=DEFAULT_CATS.map(c=>({...c}));
  db=Object.assign({sound:true,vib:true,lock:false,remind:{on:false,freq:'daily',time:'20:00'},recapNotif:true,lastRecap:'',askedNotif:false,name:'',accent:0,budget:0},db);
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}scheduleSync()}
load();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const catById=id=>db.cats.find(c=>c.id===id)||{name:'Sans catégorie',emoji:'',color:'#8a8a93',type:'expense'};

/* ================= FORMAT ================= */
const fmt=new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const money=v=>fmt.format(v);
const signed=v=>Math.abs(v)<.005?money(0):(v>0?'+':'−')+money(Math.abs(v));
function moneyParts(v){const parts=fmt.formatToParts(Math.abs(v));let i='',d='';for(const p of parts){if(p.type==='integer'||p.type==='group')i+=p.value;else d+=p.value}const L=i.replace(/\D/g,'').length;return{i,d,k:L<=3?1:L===4?.9:L===5?.78:.66}}
function bigMoney(v,sign){
  const{i,d,k}=moneyParts(v),s=v<0?'−':(sign&&v>0?'+':'');
  return `<span class="i" style="font-size:calc(var(--mi) * ${k})">${s}${i}</span><span class="d" style="font-size:calc(var(--mi) * ${k} * .5)">${d}</span>`;
}
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MSHORT=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const de=m=>(/^[aeiouyéèêàâîôûh]/i.test(m)?'d\'':'de ')+m;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO=()=>isoOf(new Date());
const ym=(y,m)=>y+'-'+pad2(m+1);
const shiftMonth=(y,m,d)=>{const t=new Date(y,m+d,1);return[t.getFullYear(),t.getMonth()]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,w)=>n+' '+w+(n>1?'s':'');
function avatar(c){const inner=c.emoji?c.emoji:`<span style="color:${c.color}">${esc((c.name||'?').trim().charAt(0).toUpperCase())}</span>`;return `<div class="av" style="background:${c.color}22">${inner}</div>`}
const icon=(n,cls)=>`<svg class="ic${cls?' '+cls:''}"><use href="#i-${n}"/></svg>`;

/* ================= ACCENT ================= */
function applyAccent(){const a=ACCENTS[db.accent]||ACCENTS[0],r=document.documentElement.style;r.setProperty('--acc',a.c);r.setProperty('--acc2',a.c2);r.setProperty('--accInk',a.ink)}
applyAccent();

/* ================= SONS ================= */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f,dur,type='sine',vol=.16,when=0,slideTo=null){
  if(!db.sound)return;const a=ac();if(!a)return;
  const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const S={
  tap:()=>tone(820,.05,'triangle',.1),
  key:()=>tone(640,.04,'sine',.12),
  nav:()=>{tone(540,.05,'sine',.1);tone(800,.06,'sine',.07,.035)},
  open:()=>tone(320,.16,'sine',.12,0,620),
  close:()=>tone(560,.14,'sine',.09,0,280),
  ok:()=>{tone(660,.11,'sine',.14);tone(880,.11,'sine',.14,.08);tone(1320,.2,'sine',.1,.16)},
  del:()=>{tone(420,.12,'triangle',.14);tone(260,.2,'triangle',.12,.1)},
  err:()=>{tone(190,.1,'square',.06);tone(150,.14,'square',.06,.1)},
  thud:(v=1)=>{tone(130*v+40,.22,'sine',.32*v,0,55);tone(90,.12,'triangle',.13*v)},
  shine:()=>{[0,1,2,3].forEach(i=>tone(880+i*220,.24,'sine',.07,i*.07))}
};
/* ================= VIBRATIONS ================= */
const Cap=window.Capacitor;
const native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
function plug(n){if(!Cap)return null;return (Cap.Plugins&&Cap.Plugins[n])||(Cap.registerPlugin?Cap.registerPlugin(n):null)}
function vib(kind='light'){
  if(!db.vib)return;const h=native?plug('Haptics'):null;
  try{if(h){
    if(kind==='success')return h.notification({type:'SUCCESS'});
    if(kind==='error')return h.notification({type:'ERROR'});

function parseCSV(text){
  text=text.replace(/^﻿/,'');const h0=text.split('\n')[0],sep=(h0.match(/;/g)||[]).length>=(h0.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],f='',qq=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(qq){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else qq=false}else f+=c}
    else if(c==='"')qq=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f.replace(/\r$/,''));rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
function csvToData(text){
  const rows=parseCSV(text);if(rows.length<2)throw 0;
  const h=rows[0].map(x=>x.trim().toLowerCase()),ix=k=>h.findIndex(x=>x.startsWith(k));
  const iD=ix('date'),iT=ix('type'),iM=ix('montant'),iC=ix('cat'),iN=ix('note');if(iD<0||iM<0)throw 0;
  const cats=db.cats.map(c=>({...c})),out=[];
  for(const r of rows.slice(1)){
    let amt=parseFloat(String(r[iM]||'').replace(/\s|€/g,'').replace(',','.'));if(!amt)continue;
    let type=/entr|inc|revenu|\+/i.test(r[iT]||'')?'income':'expense';if(amt<0){amt=-amt;type='expense'}
    let d=(r[iD]||'').trim();const m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);if(m)d=m[3]+'-'+pad2(m[2])+'-'+pad2(m[1]);if(!/^\d{4}-\d{2}-\d{2}$/.test(d))continue;
    const cn=(iC>=0?r[iC]:'').trim()||'Autre';let c=cats.find(x=>x.name.toLowerCase()===cn.toLowerCase()&&x.type===type);
    if(!c){c={id:'c'+uid(),name:cn,type,emoji:'',color:COLORS[cats.length%COLORS.length]};cats.push(c)}
    out.push({id:uid(),ts:Date.now(),type,amount:Math.round(amt*100)/100,cat:c.id,note:iN>=0?(r[iN]||'').trim():'',date:d});
  }
  if(!out.length)throw 0;return{tx:out,cats};
}

      list.push({id:N_RECAP,title:`Ton bilan ${de(MONTHS[m])} est prêt`,body:`${money(s.exp)} dépensés${cmp} · solde ${signed(s.bal)}. Touche pour voir le détail.`,channelId:'ecos',smallIcon:'ic_stat_ecos',iconColor:'#8B7CF6',autoCancel:true,schedule:{at:new Date(y,m+1,1,9,0,0),allowWhileIdle:true},extra:{type:'recap'}})}
    if(list.length)await L.schedule({notifications:list});
  }catch(e){console.log('notif',e)}
}
let pendingAction=null;
if(LN())LN().addListener('localNotificationActionPerformed',a=>{pendingAction=a&&a.notification&&a.notification.extra&&a.notification.extra.type;if(ready&&!locked)runPending()});
function runPending(){const t=pendingAction;pendingAction=null;if(t==='recap'){db.lastRecap='';autoRecap()}else if(t==='remind')setTimeout(()=>openTx(null),350)}
async function needNotifs(){if(await notifPerm(true))return true;info('Notifications bloquées','Autorise les notifications pour Écos dans les paramètres Android.');return false}
$('#swRemind').addEventListener('click',async()=>{if(!db.remind.on&&native&&!await needNotifs())return;db.remind.on=!db.remind.on;save();renderSet();fx('tap','medium')});
$('#swRecap').addEventListener('click',async()=>{if(!db.recapNotif&&native&&!await needNotifs())return;db.recapNotif=!db.recapNotif;save();renderSet();fx('tap','medium')});
$('#remindTime').addEventListener('change',e=>{if(e.target.value){db.remind.time=e.target.value;save();fx('tap','light')}});

/* ================= EMPREINTE ================= */
const BIO=()=>native?plug('NativeBiometric'):null;
let locked=false,ready=false,hiddenAt=0,trying=false,firstOpen=true;
async function bioAvailable(){const B=BIO();if(!B)return false;try{const r=await B.isAvailable({useFallback:false});return !!r.isAvailable}catch(e){return false}}
async function bioCheck(){const B=BIO();if(!B)return true;try{await B.verifyIdentity({title:'Déverrouiller Écos',subtitle:'Utilise ton empreinte',negativeButtonText:'Annuler'});return true}catch(e){return false}}
async function lockApp(){
  if(locked)return;locked=true;hideSheet(true);
  const L=$('#lock');L.classList.remove('out');L.classList.add('on');$('#lockMsg').textContent='Touche pour déverrouiller';
  if(!await bioAvailable()){unlock(true);return}
  setTimeout(tryUnlock,300);
}
async function tryUnlock(){
  if(trying)return;trying=true;const ok=await bioCheck();trying=false;
  if(ok)unlock();else{const b=$('#fpBtn');b.classList.remove('err');b.offsetWidth;b.classList.add('err');fx('err','error');$('#lockMsg').textContent='Touche pour réessayer'}
}
function unlock(silent){locked=false;const L=$('#lock');L.classList.add('out');if(!silent)fx('ok','success');setTimeout(()=>L.classList.remove('on','out'),380);afterUnlock()}
function afterUnlock(){
  if(!firstOpen){if(pendingAction)runPending();return}
  firstOpen=false;runRecurring();$('#navWrap').classList.add('show');render('home');requestAnimationFrame(()=>{placeAll();placeNav()});
  if(pendingAction)runPending();else autoRecap();
  if(native&&!db.askedNotif){db.askedNotif=true;save();setTimeout(async()=>{if(await notifPerm(true))syncNotifs()},1800)}
}
$('#fpBtn').addEventListener('click',()=>{fx('tap','medium');tryUnlock()});
$('#lockNow').addEventListener('click',()=>{fx('tap','medium');lockApp()});
$('#swLock').addEventListener('click',async()=>{
  if(!db.lock){
    if(!native){info('Empreinte','Disponible dans l\'app Android.');return}
    if(!await bioAvailable()){info('Aucune empreinte','Enregistre d\'abord une empreinte dans les paramètres du téléphone.');return}
    if(!await bioCheck()){fx('err','error');return}
    db.lock=true;fx('ok','success');
  }else{if(!await bioCheck()){fx('err','error');return}db.lock=false;fx('tap','medium')}
  save();renderSet();
});

/* ================= CYCLE DE VIE ANDROID ================= */
const App=plug('App');
if(App&&native){
  App.addListener('backButton',()=>{
    if(locked){App.minimizeApp?App.minimizeApp():App.exitApp();return}
    if($('#dlg').classList.contains('on')){$('#dlgNo').style.display==='none'?$('#dlgYes').click():$('#dlgNo').click();return}
    if(openSheet){hideSheet();return}
    if(cur==='hist'&&searching){setSearch(false);return}
    if(cur!=='home'){go('home');return}
    App.minimizeApp?App.minimizeApp():App.exitApp();
  });
  App.addListener('appStateChange',({isActive})=>{
    if(!isActive){hiddenAt=Date.now();if(db.lock&&ready&&!external)$('#lock').classList.add('on');return}
    if(db.lock&&ready&&!external&&!locked&&Date.now()-hiddenAt>15000)lockApp();
    else if(!locked)$('#lock').classList.remove('on');
    if(ready&&!locked){runRecurring();render()}
  });
}
syncNotifs();

/* ================= LANCEMENT : le E descend au centre ================= */
function splash(){
  const e=$('#eShape'),fall=window.innerHeight*.55,D=480,EZ='cubic-bezier(.16,.84,.3,1)';
  e.animate([{transform:`translateY(${-fall}px)`,opacity:0},{opacity:1,offset:.3},{transform:'none',opacity:1}],{duration:D,easing:EZ,fill:'both'});
  setTimeout(()=>{S.thud(.7);vib('medium')},D*.55);
  $$('.sbar').forEach((b,i)=>b.animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:280,delay:D-120+i*55,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'}));
  setTimeout(()=>{
    ready=true;
    if(db.lock&&native)lockApp();else afterUnlock();
    $('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),400);
  },D+480);
}
document.addEventListener('touchstart',()=>ac(),{once:true,passive:true});
setTitle();
let started=false;const start=()=>{if(started)return;started=true;ac();splash()};
const fr=document.fonts&&document.fonts.load?Promise.all([500,600,700].map(w=>document.fonts.load(w+' 16px Inter'))).catch(()=>{}):Promise.resolve();
Promise.race([fr,new Promise(r=>setTimeout(r,700))]).then(()=>{if(document.readyState==='complete')start();else window.addEventListener('load',start)});
})();
</script>
</body>
